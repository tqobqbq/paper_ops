[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-ops"
version = "0.1.0"
description = "Paper ingestion, translation, and indexing pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4",
  "feedparser",
  "pydantic>=2",
  "PyYAML",
  "requests",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
paper-ops = "paper_ops.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
